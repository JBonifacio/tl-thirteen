# Cache policy is picked here rather than with add_header inside location
# blocks: any add_header in a location drops every server-level add_header,
# which would strip the security headers from those responses.
map $uri $cache_control {
    default                              "";
    /index.html                          "no-store";
    ~*\.(js|css|png|svg|ico|woff2?)$     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (no location block may use add_header, see above)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control;

    # Proxy API requests to the API service
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # Only cloudflared can reach nginx, so Cloudflare's client IP header is
        # trustworthy here. $remote_addr is always the cloudflared container.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve the SPA: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing static assets 404 instead of falling back to index.html
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
